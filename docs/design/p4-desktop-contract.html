document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;text-align:right;\">184 →<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{goNation}}\" style=\"border-top:2px solid #221E19;background:#C88A5C;cursor:pointer;user-select:none;animation:{{ov3}};display:grid;grid-template-columns:340px 1fr 200px;gap:32px;align-items:center;padding:22px 40px;\">\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;\">HISTORIES<\u002Fdiv>\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:15px;color:#42301F;\">Every event dated, sourced, and set in its bed. Depth is time — down is older, always. <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#42301F;\">SAMPLE: JAPAN · 312 EVENTS<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;text-align:right;\">4,564 →<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{goRank}}\" style=\"border-top:2px solid #221E19;background:#A64B26;cursor:pointer;user-select:none;animation:{{ov4}};display:grid;grid-template-columns:340px 1fr 200px;gap:32px;align-items:center;padding:22px 40px;\">\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;color:#EFE7D8;\">RANKINGS<\u002Fdiv>\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:15px;color:#E2D3B8;\">50 indicators across the whole wall — every value with its year and source; the unobserved hold their places as hatched gaps.<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;text-align:right;color:#EFE7D8;\">50 →<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{goCompare}}\" style=\"border-top:2px solid #221E19;background:#6E4A32;cursor:pointer;user-select:none;animation:{{ov5}};display:grid;grid-template-columns:340px 1fr 200px;gap:32px;align-items:center;padding:22px 40px;\">\n      <div style=\"font-family:'Bricolag lder-val=\"{{ false }}\">\n  <div data-screen-label=\"P4 Section cut\" style=\"animation:bedSettle 380ms cubic-bezier(0.32,0.72,0,1) both;\">\n    <div style=\"display:grid;grid-template-columns:1fr 420px;gap:40px;align-items:end;padding:30px 40px 18px 40px;\">\n      <div>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:52px;line-height:1;\">THE SECTION CUT<\u002Fdiv>\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:15px;color:#6E4A32;margin-top:8px;\">You are standing in the quarry. The whole wall at once — continents as beds, nations as seams. Deeper is older ground.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6E4A32;text-align:right;letter-spacing:0.1em;padding-bottom:6px;\">184 SEAMS · TAP A SEAM TO PULL ITS CORE<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{cutBeds}}\" as=\"bed\">\n      <div style=\"border-top:2px solid #221E19;background:{{bed.bg}};display:grid;grid-template-columns:64px 260px 1fr 120px;align-items:stretch;\">\n        <div style=\"border-right:2px solid #221E19;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{bed.dim}};writing-mode:vertical-rl;padding:10px 0;letter-spacing:0.18em;\">{{bed.depth}}<\u002Fdiv>\n        <div style=\"padding:20px 24px;display:flex;flex-direction:column;justify-content:center;gap:4px;\">\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;color:{{bed.fg}};\">{{bed.name}}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{bed.dim}};\">{{bed.count}} SEAMS<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 24px;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;\">\n          <sc-for list=\"{{bed.seams}}\" as=\"seam\">\n            <div sc-camel-on-click=\"{{seam.go}}\" style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:14.5px;color:{{seam.fg}};background:{{seam.bg}};padding:{{seam.pad}};cursor:pointer;user-select:none;white-space:nowrap;\">{{seam.name}} <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:{{seam.dim}};\">{{seam.coord}}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{bed.dim}};\">+ {{bed.more}} MORE …<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-left:2px solid #221E19;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:{{bed.fg}};\">ALL →<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"border-top:2px solid #221E19;padding:14px 40px;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6E4A32;\"><div>THE WALL RUNS A–Z WITHIN EACH BED<\u002Fdiv><div>DEPTH ORDER = OLDEST MEDIAN FIRST RECORD<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isNation}}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"P4 Nation — Japan\" style=\"animation:bedSettle 380ms cubic-bezier(0.32,0.72,0,1) both;display:grid;grid-template-columns:120px 1fr 440px;align-items:stretch;\">\n    <div style=\"border-right:2px solid #221E19;display:flex;flex-direction:column;\">\n      <div style=\"padding:12px 8px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#6E4A32;letter-spacing:0.14em;text-align:center;border-bottom:2px solid #221E19;\">CORE —<br>EXTRACTED<\u002Fdiv>\n      <sc-for list=\"{{coreBands}}\" as=\"band\">\n        <div sc-camel-on-click=\"{{band.pick}}\" style=\"flex:{{band.flex}};background:{{band.bg}};border-bottom:2px solid #221E19;border-left:{{band.notch}};cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;\">\n          <div style=\"writing-mode:vertical-rl;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:{{band.fg}};\">{{band.tag}}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"padding:10px 8px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:#6E4A32;text-align:center;letter-spacing:0.1em;\">THICKNESS ∝ EVENTS<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"padding:26px 36px 18px 36px;\">\n        <div sc-camel-on-click=\"{{goCut}}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;color:#A64B26;cursor:pointer;user-select:none;padding:4px 0;\">← SECTION CUT · ASIA · SEAM 84/184<\u002Fdiv>\n        <div style=\"margin-top:4px;\">\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:76px;line-height:1;\">JAPAN<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A64B26;white-space:nowrap;margin-top:10px;\">35.7N 139.7E · 312 EVENTS · 9 DOMAINS · OBS 2024<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{eraBeds}}\" as=\"era\">\n        <div style=\"border-top:2px solid #221E19;background:{{era.bg}};padding:16px 36px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;\">\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;color:{{era.fg}};\">{{era.title}} {{era.mark}}<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{era.dim}};\">{{era.count}} EVENTS · READ THE BED →<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px 44px;margin-top:10px;\">\n            <sc-for list=\"{{era.events}}\" as=\"ev\">\n              <div style=\"display:flex;gap:12px;align-items:baseline;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:{{era.year}};flex:none;width:40px;\">{{ev.y}}<\u002Fdiv>\n                <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:14px;color:{{era.fg}};line-height:1.4;\">{{ev.t}} <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:{{era.dim}};\">{{ev.r}} REFS<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"border-top:2px solid #221E19;background:#42301F;padding:12px 36px;display:flex;justify-content:space-between;align-items:baseline;\">\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;color:#EFE7D8;\">DEEPER BEDS · 660 — 1603<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#C88A5C;\">34 EVENTS · KEEP DIGGING ↓<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{goPair}}\" style=\"border-top:2px solid #221E19;padding:14px 36px 24px 36px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#A64B26;cursor:pointer;user-select:none;\">LAY JAPAN ON THE BENCH — CUT A JUNCTION ⤬<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-left:2px solid #221E19;\">\n      <div style=\"position:sticky;top:0;\">\n        <div style=\"padding:20px 26px 12px 26px;display:flex;justify-content:space-between;align-items:baseline;\">\n          <div><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;\">SPECIMEN BENCH<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#6E4A32;margin-top:4px;letter-spacing:0.1em;\">PRESS A SPECIMEN —<br>IT TURNS OVER<\u002Fdiv><\u002Fdiv>\n          <div sc-camel-on-click=\"{{toggleProof}}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#A64B26;cursor:pointer;user-select:none;padding:4px 0 4px 10px;\">{{proofLabel}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 26px;\">\n          <sc-for list=\"{{dossierRows}}\" as=\"row\">\n            <div sc-camel-on-pointer-down=\"{{row.down}}\" sc-camel-on-pointer-up=\"{{row.up}}\" sc-camel-on-pointer-leave=\"{{row.up}}\" sc-camel-on-pointer-cancel=\"{{row.up}}\" style=\"perspective:900px;border-top:2px solid #221E19;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y;\">\n              <div style=\"position:relative;height:56px;transform-style:preserve-3d;transition:transform 320ms cubic-bezier(0.32,0.72,0,1);transform:{{row.tf}};\">\n                <div style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;justify-content:space-between;align-items:center;\">\n                  <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:14px;\">{{row.label}}<\u002Fdiv>\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">{{row.value}} <span style=\"background:#E2D3B8;border-radius:9px;padding:2px 8px;font-size:9.5px;color:#6E4A32;\">{{row.year}} {{row.src}}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateX(180deg);background:#221E19;color:#EFE7D8;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 12px;\">\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;\">OBSERVED {{row.obsyear}} · {{row.src}} — {{row.org}}<\u002Fdiv>\n                  <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:11px;color:#C88A5C;\">method: {{row.method}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"border-top:2px solid #221E19;display:flex;justify-content:space-between;align-items:center;padding:14px 0;\">\n            <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:14px;color:#6E4A32;\">MILITARY · EXPENDITURE<\u002Fdiv>\n            <div style=\"background:repeating-linear-gradient(45deg,#B8AC97 0 3px,#EFE7D8 3px 7px);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 10px;\">NOT OBSERVED<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid #221E19;padding:12px 0 20px 0;font-family:'Schibsted Grotesk',sans-serif;font-size:12px;color:#6E4A32;line-height:1.55;\">The gap has no underside — there is nothing to turn over. Absence is stated, never zeroed.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isRank}}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"P4 Ranking — Rice yield\" style=\"animation:bedSettle 380ms cubic-bezier(0.32,0.72,0,1) both;\">\n    <div style=\"display:grid;grid-template-columns:460px 1fr 300px;gap:44px;align-items:end;padding:28px 40px 16px 40px;border-bottom:2px solid #221E19;\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;color:#A64B26;\">RANKINGS · AGRICULTURE · 12/50<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:56px;line-height:1;margin-top:6px;\">RICE YIELD<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A64B26;margin-top:8px;\">TONNES / HECTARE · OBSERVED 2020–2024<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding-bottom:4px;\">\n        <div style=\"display:flex;align-items:flex-end;gap:2px;height:56px;\">\n          <sc-for list=\"{{strip}}\" as=\"s\">\n            <div style=\"width:4px;height:{{s.h}};background:{{s.bg}};flex:none;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#6E4A32;margin-top:6px;\"><div>RANK 001<\u002Fdiv><div>THE WHOLE WALL · 172 OBSERVED + 12 HATCHED<\u002Fdiv><div>172<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12.5px;color:#6E4A32;padding-bottom:6px;line-height:1.5;\">Press any row — its specimen turns over on the readout ledge. No bests, no worsts: observations, ranked.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr 340px;align-items:start;\">\n      <sc-for list=\"{{rankCols}}\" as=\"col\">\n        <div style=\"border-right:2px solid #221E19;\">\n          <div style=\"padding:10px 22px;border-bottom:2px solid #221E19;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#6E4A32;\">{{col.title}}<\u002Fdiv>\n          <div style=\"padding:8px 22px 16px 22px;\">\n            <sc-for list=\"{{col.rows}}\" as=\"row\">\n              <div sc-camel-on-click=\"{{row.pick}}\" style=\"display:flex;align-items:baseline;gap:8px;padding:4.5px 6px;margin:0 -6px;background:{{row.bg}};cursor:pointer;user-select:none;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#A64B26;flex:none;width:30px;\">{{row.rank}}<\u002Fdiv>\n                <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:13px;color:{{row.tone}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{row.name}}<\u002Fdiv>\n                <div style=\"flex:1;border-bottom:2px dotted #B8AC97;min-width:12px;\"><\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:{{row.tone}};flex:none;\">{{row.value}} <span style=\"font-size:8.5px;color:#6E4A32;\">{{row.year}}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{col.hasAbsent}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:2px solid #221E19;margin-top:10px;padding-top:10px;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#6E4A32;\">NOT OBSERVED · 12<\u002Fdiv>\n                <sc-for list=\"{{absentRows}}\" as=\"ab\">\n                  <div style=\"display:flex;align-items:center;gap:8px;padding:4.5px 0;\">\n                    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#B8AC97;flex:none;width:30px;\">—<\u002Fdiv>\n                    <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:13px;color:#6E4A32;\">{{ab.name}}<\u002Fdiv>\n                    <div style=\"flex:1;\"><\u002Fdiv>\n                    <div style=\"background:repeating-linear-gradient(45deg,#B8AC97 0 3px,#EFE7D8 3px 7px);width:64px;height:12px;flex:none;\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;color:#6E4A32;line-height:1.5;margin-top:8px;\">They hold their places as hatched gaps — absence is information; zero is a lie.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"padding:20px 26px;\">\n        <div style=\"position:sticky;top:20px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;color:#6E4A32;\">THE READOUT LEDGE<\u002Fdiv>\n          <div style=\"perspective:900px;margin-top:10px;\">\n            <div style=\"position:relative;height:190px;transform-style:preserve-3d;transition:transform 320ms cubic-bezier(0.32,0.72,0,1);transform:{{ledgeTf}};\">\n              <div style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid #221E19;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:8px;\">\n                <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;\">NO SPECIMEN ON THE LEDGE<\u002Fdiv>\n                <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:13px;color:#6E4A32;line-height:1.5;\">Press any row on the wall. Its specimen lands here and turns over to its label — year, source, method.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateX(180deg);background:#221E19;color:#EFE7D8;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:7px;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#C88A5C;letter-spacing:0.14em;\">RANK {{selRank}} · SPECIMEN<\u002Fdiv>\n                <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;\">{{selName}}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;\">{{selValue}} t/ha <span style=\"font-size:10px;color:#C88A5C;\">OBSERVED {{selObs}}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;\">{{selSrc}} — {{selOrg}}<\u002Fdiv>\n                <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:11.5px;color:#C88A5C;\">method: {{selMethod}}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;color:#6E4A32;line-height:1.55;margin-top:14px;\">The strip above the wall is the whole distribution — the wall below is its full text. Nothing is truncated to a “top 10”.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isCompare}}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"P4 Compare index\" style=\"animation:bedSettle 380ms cubic-bezier(0.32,0.72,0,1) both;display:grid;grid-template-columns:420px 1fr;align-items:stretch;\">\n    <div style=\"border-right:2px solid #221E19;padding:26px 30px;\">\n      <div style=\"position:sticky;top:20px;\">\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1;\">THE JUNCTION TRAY<\u002Fdiv>\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:13.5px;color:#6E4A32;margin-top:8px;line-height:1.5;\">Two slots. Fill them from the bench, then cut where the histories touch.<\u002Fdiv>\n        <div style=\"border:2px solid #221E19;margin-top:18px;padding:16px 18px;background:{{slotABg}};\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:#6E4A32;\">SLOT A<\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;margin-top:4px;\">{{slotA}}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#A64B26;margin-top:2px;\">{{slotACoord}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:center;padding:8px 0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A64B26;\">⤬<\u002Fdiv>\n        <div style=\"border:2px solid #221E19;padding:16px 18px;background:{{slotBBg}};\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:#6E4A32;\">SLOT B<\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;margin-top:4px;\">{{slotB}}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#A64B26;margin-top:2px;\">{{slotBCoord}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{goPair}}\" style=\"margin-top:18px;background:#221E19;color:#EFE7D8;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;\">\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;\">CUT THE JUNCTION<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">→<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#6E4A32;margin-top:14px;letter-spacing:0.08em;\">TAP A SEAM ON THE BENCH — IT FALLS INTO THE NEXT SLOT<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"padding:26px 36px 0 36px;display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:end;\">\n        <div style=\"display:flex;gap:0;border:2px solid #221E19;width:fit-content;\">\n          <sc-for list=\"{{tabs}}\" as=\"t\">\n            <div sc-camel-on-click=\"{{t.go}}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;padding:11px 20px;cursor:pointer;user-select:none;background:{{t.bg}};color:{{t.fg}};border-right:{{t.line}};\">{{t.label}}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border:2px solid #221E19;display:flex;align-items:center;\">\n          <input sc-camel-on-input=\"{{digInput}}\" placeholder=\"Dig to filter the bench…\" style=\"border:none;background:#EFE7D8;font-family:'Schibsted Grotesk',sans-serif;font-size:14px;color:#221E19;padding:12px 14px;flex:1;min-width:0;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A64B26;padding:0 14px;\">DIG<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{showGroups}}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-for list=\"{{compareGroups}}\" as=\"grp\">\n          <div style=\"padding:22px 36px 4px 36px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;color:#6E4A32;border-bottom:2px solid #221E19;padding-bottom:6px;\">{{grp.name}}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding-top:12px;\">\n              <sc-for list=\"{{grp.tiles}}\" as=\"tile\">\n                <div sc-camel-on-click=\"{{tile.pick}}\" style=\"border:2px solid #221E19;padding:12px 14px;cursor:pointer;user-select:none;background:{{tile.bg}};\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;color:{{tile.fg}};\">{{tile.name}}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:{{tile.slot}};\">{{tile.tag}}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#6E4A32;margin-top:3px;\">{{tile.coord}}<\u002Fdiv>\n                  <div style=\"display:flex;height:6px;margin-top:9px;\"><div style=\"flex:3;background:#E2D3B8;\"><\u002Fdiv><div style=\"flex:4;background:#C88A5C;\"><\u002Fdiv><div style=\"flex:2;background:#A64B26;\"><\u002Fdiv><div style=\"flex:3;background:#6E4A32;\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n      <sc-if value=\"{{showEntangled}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:22px 36px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;color:#6E4A32;border-bottom:2px solid #221E19;padding-bottom:6px;\">MOST ENTANGLED — PAIRS WITH THE MOST SHARED, SOURCED EVENTS<\u002Fdiv>\n          <sc-for list=\"{{pairsList}}\" as=\"p\">\n            <div sc-camel-on-click=\"{{p.load}}\" style=\"display:grid;grid-template-columns:1fr 80px 1fr 200px;gap:16px;align-items:center;border-bottom:2px solid #E2D3B8;padding:13px 0;cursor:pointer;user-select:none;\">\n              <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;text-align:right;\">{{p.a}}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A64B26;text-align:center;\">⤬<\u002Fdiv>\n              <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;\">{{p.b}}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6E4A32;text-align:right;\">{{p.n}} JUNCTION EVENTS →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12.5px;color:#6E4A32;margin-top:12px;\">Entanglement counts shared sourced events only — it measures record, not friendship.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"padding:8px 36px 26px 36px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#6E4A32;letter-spacing:0.08em;\">{{digNote}}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isPair}}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"P4 Compare pair\" style=\"animation:bedSettle 380ms cubic-bezier(0.32,0.72,0,1) both;\">\n    <div style=\"padding:28px 40px 18px 40px;display:grid;grid-template-columns:1fr auto 1fr;gap:28px;align-items:center;border-bottom:2px solid #221E19;\">\n      <div style=\"text-align:right;\">\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:54px;line-height:1;\">{{slotA}}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A64B26;margin-top:6px;\">{{slotACoord}} · 312 EVENTS<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#A64B26;\">⤬<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6E4A32;letter-spacing:0.12em;margin-top:4px;\">THE JUNCTION<br>14 SHARED EVENTS<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:54px;line-height:1;\">{{slotB}}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A64B26;margin-top:6px;\">{{slotBCoord}} · 248 EVENTS<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:20px 40px 6px 40px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;color:#6E4A32;text-align:center;\">ONE SPINE OF YEARS · TWO WALLS OF EVENTS · JUNCTIONS RUN THE FULL WIDTH<\u002Fdiv>\n    <div style=\"padding:6px 40px 10px 40px;\">\n      <sc-for list=\"{{pairEvents}}\" as=\"ev\">\n        <div style=\"display:grid;grid-template-columns:1fr 110px 1fr;gap:22px;align-items:center;background:{{ev.bg}};padding:9px 12px;margin:0 -12px;\">\n          <div style=\"text-align:right;font-family:'Schibsted Grotesk',sans-serif;font-size:14px;color:{{ev.lc}};line-height:1.45;\">{{ev.l}} <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#6E4A32;\">{{ev.lr}}<\u002Fspan><\u002Fdiv>\n          <div style=\"text-align:center;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ev.yc}};\">{{ev.y}}<\u002Fdiv>\n            <div style=\"width:10px;height:10px;margin:4px auto 0 auto;background:{{ev.dot}};border:2px solid #221E19;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:14px;color:{{ev.rc}};line-height:1.45;\">{{ev.r}} <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:#6E4A32;\">{{ev.rr}}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:grid;grid-template-columns:1fr 110px 1fr;gap:22px;padding:8px 0;\">\n        <div style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#6E4A32;\">298 MORE EVENTS BELOW ↓<\u002Fdiv>\n        <div style=\"text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#A64B26;\">OXIDE = JUNCTION<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#6E4A32;\">234 MORE EVENTS BELOW ↓<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid #221E19;padding:18px 40px 8px 40px;display:flex;justify-content:space-between;align-items:baseline;\">\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;\">THE DOSSIER DUEL<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#6E4A32;letter-spacing:0.1em;\">PRESS EITHER SIDE — EACH SPECIMEN CARRIES ITS OWN PROOF<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 40px 26px 40px;\">\n      <sc-for list=\"{{duelRows}}\" as=\"d\">\n        <div style=\"display:grid;grid-template-columns:1fr 260px 1fr;gap:22px;align-items:stretch;border-bottom:2px solid #221E19;padding:8px 0;\">\n          <sc-if value=\"{{d.aObserved}}\" hint-placeholder-val=\"{{ true }}\">\n            <div sc-camel-on-pointer-down=\"{{d.aDown}}\" sc-camel-on-pointer-up=\"{{d.aUp}}\" sc-camel-on-pointer-leave=\"{{d.aUp}}\" sc-camel-on-pointer-cancel=\"{{d.aUp}}\" style=\"perspective:900px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y;\">\n              <div style=\"position:relative;height:50px;transform-style:preserve-3d;transition:transform 320ms cubic-bezier(0.32,0.72,0,1);transform:{{d.aTf}};\">\n                <div style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:flex-end;font-family:'IBM Plex Mono',monospace;font-size:16px;\">{{d.aV}} <span style=\"background:#E2D3B8;border-radius:9px;padding:2px 8px;font-size:9.5px;color:#6E4A32;margin-left:10px;\">{{d.aY}} {{d.aSrc}}<\u002Fspan><\u002Fdiv>\n                <div style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateX(180deg);background:#221E19;color:#EFE7D8;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:2px;padding:0 12px;\">\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;\">{{d.aSrc}} — {{d.aOrg}}<\u002Fdiv>\n                  <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:11px;color:#C88A5C;\">{{d.aMethod}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{d.aAbsent}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;justify-content:flex-end;\"><div style=\"background:repeating-linear-gradient(45deg,#B8AC97 0 3px,#EFE7D8 3px 7px);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:5px 12px;\">NOT OBSERVED<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:13px;color:#6E4A32;letter-spacing:0.04em;\">{{d.label}}<\u002Fdiv>\n          <sc-if value=\"{{d.bObserved}}\" hint-placeholder-val=\"{{ true }}\">\n            <div sc-camel-on-pointer-down=\"{{d.bDown}}\" sc-camel-on-pointer-up=\"{{d.bUp}}\" sc-camel-on-pointer-leave=\"{{d.bUp}}\" sc-camel-on-pointer-cancel=\"{{d.bUp}}\" style=\"perspective:900px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y;\">\n              <div style=\"position:relative;height:50px;transform-style:preserve-3d;transition:transform 320ms cubic-bezier(0.32,0.72,0,1);transform:{{d.bTf}};\">\n                <div style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:16px;\">{{d.bV}} <span style=\"background:#E2D3B8;border-radius:9px;padding:2px 8px;font-size:9.5px;color:#6E4A32;margin-left:10px;\">{{d.bY}} {{d.bSrc}}<\u002Fspan><\u002Fdiv>\n                <div style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateX(180deg);background:#221E19;color:#EFE7D8;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 12px;\">\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;\">{{d.bSrc}} — {{d.bOrg}}<\u002Fdiv>\n                  <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:11px;color:#C88A5C;\">{{d.bMethod}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{d.bAbsent}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;\"><div style=\"background:repeating-linear-gradient(45deg,#B8AC97 0 3px,#EFE7D8 3px 7px);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:5px 12px;\">NOT OBSERVED<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12.5px;color:#6E4A32;margin-top:12px;\">A hatched gap faces a number without apology: one was observed, one was not. The comparison states both; it adjudicates neither.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"border-top:2px solid #221E19;padding:16px 40px 28px 40px;\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.16em;color:#6E4A32;\">DEVIATIONS &amp; DESKTOP EXTENSIONS TO THE P3 CONTRACT<\u002Fdiv>\n    <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;color:#6E4A32;line-height:1.65;margin-top:6px;max-width:1100px;\">\n    1. OVERTURE AT WIDTH — masthead 0ms · headline 60ms · five beds 120–480ms (90ms stagger) · dig bar 570ms · all bedSettle 380ms · cubic-bezier(.32,.72,0,1); last motion ends at 950ms, inside the 1.1s budget. Plays once per session (sessionStorage flag); every later visit renders still.\n    2. THE CORE IS ALREADY ON THE BENCH — on desktop the nation core is permanently extracted as the left rail; pull-the-core is a phone gesture, a bench doesn’t need it. Bands stay clickable era navigation (basalt notch marks the selected bed).\n    3. THE READOUT LEDGE — at ranking density (172 rows in three honest columns) flipping rows in place would tear the wall; the press lands the specimen on a fixed ledge that turns over at the same 320ms flip. Selecting a new row re-flips.\n    4. RULES AS COLUMNS — the 2px rule, horizontal on phone, is used vertically to build multi-column beds; still no hairlines anywhere.\n    5. AT 1920 the frame holds at 1760px max and margins grow; the cut-face beds stay full-bleed inside it. AT 1024 the nation bench drops below the beds (core rail stays), the ranking wall goes to two columns with the ledge beneath the header, and the junction tray docks above the bench.\n    6. All motion remains transform/opacity only; nothing loops, nothing renders continuously.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'front', flipped: {}, allProof: false,\n    selRank: null, ledgeUp: false,\n    tab: 'HOOD', digQ: '', slotA: 'JAPAN', slotB: 'PORTUGAL', nextSlot: 'A',\n    selEra: 0,\n    overture: (function(){ try { return !sessionStorage.getItem('tl-overture'); } catch(e) { return true; } })()\n  };\n  componentDidMount() {\n    try { sessionStorage.setItem('tl-overture', '1'); } catch (e) {}\n    if (this.state.overture) this._ovT = setTimeout(() => this.setState({ overture: false }), 1300);\n  }\n  componentWillUnmount() { clearTimeout(this._ovT); }\n  go(s) { this.setState({ screen: s, flipped: {}, allProof: false, selRank: null, ledgeUp: false }); window.scrollTo(0, 0); }\n  flip(id, on) { this.setState(st => ({ flipped: { ...st.flipped, [id]: on } })); }\n  mkFlip(id) {\n    const f = this.state.flipped[id] || this.state.allProof;\n    return {\n      tf: f ? 'rotateX(180deg)' : 'rotateX(0deg)',\n      down: (e) => { e.preventDefault(); this.flip(id, true); },\n      up: () => { if (!this.state.allProof) this.flip(id, false); }\n    };\n  }\n  renderVals() {\n    const s = this.state.screen;\n    const COORDS = { JAPAN:'36N 138E', PORTUGAL:'40N 8W', INDONESIA:'2S 118E', KAZAKHSTAN:'48N 67E', KOREA:'36N 128E', VIETNAM:'16N 108E', INDIA:'21N 78E', 'TÜRKIYE':'39N 35E', MONGOLIA:'46N 105E', FRANCE:'46N 2E', NORWAY:'62N 10E', POLAND:'52N 20E', SPAIN:'40N 4W', ITALY:'42N 12E', GERMANY:'51N 9E', GREECE:'39N 22E', GHANA:'8N 1W', KENYA:'0N 38E', MOROCCO:'32N 6W', NIGERIA:'9N 8E', EGYPT:'27N 30E', ALGERIA:'28N 2E', SENEGAL:'14N 14W', ZAMBIA:'13S 28E', CHILE:'33S 71W', BRAZIL:'10S 55W', CANADA:'56N 106W', MEXICO:'23N 102W', PERU:'12S 76W', ARGENTINA:'34S 64W', COLOMBIA:'4N 73W', CUBA:'22N 79W', AUSTRALIA:'25S 134E', FIJI:'18S 178E', 'NEW ZEALAND':'42S 174E', SAMOA:'14S 172W', CHINA:'35N 104E', RUSSIA:'61N 90E', 'SAUDI ARABIA':'24N 45E', 'SOUTH AFRICA':'29S 25E', 'UNITED KINGDOM':'54N 2W', 'UNITED STATES':'38N 97W' };\n    const coord = (n) => COORDS[n] || '· · ·';\n\n    // ---- nav\n    const items = [\n      { label: 'FRONT', key: 'front' }, { label: 'SECTION CUT', key: 'cut' }, { label: 'JAPAN', key: 'nation' },\n      { label: 'RANKINGS', key: 'rank' }, { label: 'COMPARE', key: 'compare' }, { label: 'JUNCTION', key: 'pair' }\n    ].map(n => ({\n      label: n.label, go: () => this.go(n.key),\n      color: s === n.key ? '#221E19' : '#6E4A32',\n      line: s === n.key ? '2px solid #A64B26' : '2px solid transparent'\n    }));\n\n    // ---- overture\n    const ov = (d) => this.state.overture ? ('bedSettle 380ms cubic-bezier(0.32,0.72,0,1) ' + d + 'ms both') : 'none';\n\n    // ---- section cut\n    const seam = (name, hot) => ({\n      name, coord: coord(name), go: () => { if (name === 'JAPAN') this.go('nation'); },\n      fg: hot ? '#EFE7D8' : 'inherit', bg: hot ? '#A64B26' : 'transparent',\n      pad: hot ? '2px 8px' : '0', dim: hot ? '#E2D3B8' : '#6E4A32'\n    });\n    const cutBeds = [\n      { name: 'EUROPE', count: 44, more: 37, depth: '0 — SHALLOW', bg: '#E2D3B8', fg: '#221E19', dim: '#6E4A32', seams: ['FRANCE','GERMANY','ITALY','NORWAY','POLAND','PORTUGAL','SPAIN'].map(n => seam(n, false)) },\n      { name: 'ASIA', count: 47, more: 40, depth: '1 — DEEPER', bg: '#C88A5C', fg: '#221E19', dim: '#42301F', seams: [seam('INDIA', false), seam('INDONESIA', false), seam('JAPAN', true), seam('KAZAKHSTAN', false), seam('KOREA', false), seam('VIETNAM', false), seam('TÜRKIYE', false)] },\n      { name: 'AFRICA', count: 54, more: 48, depth: '2', bg: '#A64B26', fg: '#EFE7D8', dim: '#E2D3B8', seams: ['ALGERIA','EGYPT','GHANA','KENYA','MOROCCO','NIGERIA'].map(n => Object.assign(seam(n, false), { fg: '#EFE7D8', dim: '#E2D3B8' })) },\n      { name: 'AMERICAS', count: 35, more: 29, depth: '3', bg: '#6E4A32', fg: '#EFE7D8', dim: '#E2D3B8', seams: ['ARGENTINA','BRAZIL','CANADA','CHILE','MEXICO','PERU'].map(n => Object.assign(seam(n, false), { fg: '#EFE7D8', dim: '#E2D3B8' })) },\n      { name: 'OCEANIA', count: 14, more: 10, depth: '4 — DEEPEST', bg: '#42301F', fg: '#EFE7D8', dim: '#C88A5C', seams: ['AUSTRALIA','FIJI','NEW ZEALAND','SAMOA'].map(n => Object.assign(seam(n, false), { fg: '#EFE7D8', dim: '#C88A5C' })) }\n    ];\n\n    // ---- nation\n    const eras = [\n      { tag: 'POSTWAR · 96', flex: 22, bg: '#E2D3B8', fg: '#221E19' },\n      { tag: 'IMPERIAL · 104', flex: 24, bg: '#C88A5C', fg: '#221E19' },\n      { tag: 'EDO · 78', flex: 18, bg: '#A64B26', fg: '#EFE7D8' },\n      { tag: 'WARRING · 21', flex: 14, bg: '#6E4A32', fg: '#EFE7D8' },\n      { tag: 'CLASSICAL · 13', flex: 16, bg: '#42301F', fg: '#C88A5C' }\n    ];\n    const coreBands = eras.map((e, i) => Object.assign({}, e, {\n      pick: () => this.setState({ selEra: Math.min(i, 2) }),\n      notch: this.state.selEra === i ? '6px solid #221E19' : '6px solid transparent'\n    }));\n    const eraDefs = [\n      { title: '1945 — NOW · POSTWAR BED', count: 96, bg: '#E2D3B8', fg: '#221E  ].map((r, i) => Object.assign({}, r, this.mkFlip('d' + i)));\n\n    // ---- ranking\n    const NATO = ['ALPHA','BRAVO','CHARLIE','DELTA','ECHO','FOXTROT','GOLF','HOTEL','INDIA','JULIETT','KILO','LIMA','MIKE','NOVEMBER','OSCAR','PAPA','QUEBEC','ROMEO','SIERRA','TANGO','UNIFORM','VICTOR','WHISKEY','XRAY','YANKEE','ZULU'];\n    const ROM = ['', ' II', ' III', ' IV', ' V', ' VI', ' VII'];\n    const YRS = ['’23', '’24', '’22', '’21', '’20'];\n    const OBS = ['2023', '2024', '2022', '2021', '2020'];\n    const ORGS = ['SAMPLE AGRI. CENSUS', 'SAMPLE CROP STATISTICS OFFICE', 'SAMPLE FIELD SURVEY UNIT'];\n    const METH = ['harvest survey, wet paddy', 'field sampling, all districts', 'satellite-assisted estimate'];\n    const rows = [];\n    for (let i = 0; i < 172; i++) {\n      const japan = i === 2;\n      rows.push({\n        idx: i, rank: String(i + 1).padStart(3, '0'),\n        name: japan ? 'JAPAN' : 'NATION ' + NATO[i % 26] + ROM[Math.floor(i / 26)],\n        value: (9.87 - i * 0.0525).toFixed(2),\n        year: YRS[i % 5], obs: OBS[i % 5],\n        src: 'S-' + (11 + (i % 40)),\n        org: japan ? 'SAMPLE CROP STATISTICS OFFICE' : ORGS[i % 3],\n        method: japan ? 'field sampling, all prefectures' : METH[i % 3],\n        tone: japan ? '#A64B26' : '#221E19'\n      });\n    }\n    const pick = (i) => {\n      this.setState({ selRank: i, ledgeUp: false });\n      clearTimeout(this._lt);\n      this._lt = setTimeout(() => this.setState({ ledgeUp: true }), 30);\n    };\n    const mkRow = (r) => Object.assign({}, r, {\n      pick: () => pick(r.idx),\n      bg: this.state.selRank === r.idx ? '#E2D3B8' : 'transparent'\n    });\n    const rankCols = [\n      { title: 'RANKS 001 — 058', rows: rows.slice(0, 58).map(mkRow), hasAbsent: false },\n      { title: 'RANKS 059 — 116', rows: rows.slice(58, 116).map(mkRow), hasAbsent: false },\n      { title: 'RANKS 117 — 172 · + THE UNOBSERVED', rows: rows.slice(116).map(mkRow), hasAbsent: true }\n    ];\n    const absentRows = [];\n    for (let i = 0; i < 12; i++) absentRows.push({ name: 'NATION ' + NATO[(i + 7) % 26] + ' VII' });\n    const strip = [];\n    for (let i = 0; i < 86; i++) { const v = rows[i * 2].value; strip.push({ h: Math.max(3, Math.round(v / 9.87 * 52)) + 'px', bg: i * 2 === 2 ? '#A64B26' : '#221E19' }); }\n    for (let i = 0; i < 6; i++) strip.push({ h: '52px', bg: 'repeating-linear-gradient(45deg,#B8AC97 0 2px,#EFE7D8 2px 5px)' });\n    const sel = this.state.selRank != null ? rows[this.state.selRank] : null;\n\n    // ---- compare index\n    const tabs = [\n      { label: 'BY NEIGHBOURHOOD', key: 'HOOD' }, { label: 'MOST ENTANGLED', key: 'ENT' }, { label: 'THE G20', key: 'G20' }\n    ].map((t, i, arr) => ({\n      label: t.label, go: () => this.setState({ tab: t.key }),\n      bg: this.state.tab === t.key ? '#221E19' : '#EFE7D8',\n      fg: this.state.tab === t.key ? '#EFE7D8' : '#6E4A32',\n      line: i < arr.length - 1 ? '2px solid #221E19' : 'none'\n    }));\n    const put = (name) => {\n      if (this.state.nextSlot === 'A') this.setState({ slotA: name, nextSlot: 'B' });\n      else this.setState({ slotB: name, nextSlot: 'A' });\n    };\n    const q = this.state.digQ.trim().toUpperCase();\n    const mkTile = (name) => ({\n      name, coord: coord(name), pick: () => put(name),\n      bg: (name === this.state.slotA || name === this.state.slotB) ? '#E2D3B8' : '#EFE7D8',\n      fg: '#221E19',\n      slot: '#A64B26',\n      tag: name === this.state.slotA ? 'SLOT A' : (name === this.state.slotB ? 'SLOT B' : '')\n    });\n    const hood = [\n      { name: 'ASIA · 47 SEAMS', tiles: ['JAPAN','INDIA','INDONESIA','KAZAKHSTAN','KOREA','MONGOLIA','TÜRKIYE','VIETNAM'] },\n      { name: 'EUROPE · 44 SEAMS', tiles: ['FRANCE','GERMANY','GREECE','ITALY','NORWAY','POLAND','PORTUGAL','SPAIN'] },\n      { name: 'AFRICA · 54 SEAMS', tiles: ['ALGERIA','EGYPT','GHANA','KENYA','MOROCCO','NIGERIA','SENEGAL','ZAMBIA'] },\n      { name: 'AMERICAS · 35 SEAMS', tiles: ['ARGENTINA','BRAZIL','CANADA','CHILE','COLOMBIA','CUBA','MEXICO','PERU'] },\n      { name: 'OCEANIA · 14 SEAMS', tiles: ['AUSTRALIA','FIJI','NEW ZEALAND','SAMOA'] }\n    ];\n    const g20 = [{ name: 'THE G20 · 19 SEAMS + ONE UNION', tiles: ['ARGENTINA','AUSTRALIA','BRAZIL','CANADA','CHINA','FRANCE','GERMANY','INDIA','INDONESIA','ITALY','JAPAN','KOREA','MEXICO','RUSSIA','SAUDI ARABIA','SOUTH AFRICA','TÜRKIYE','UNITED KINGDOM','UNITED STATES'] }];\n    const src = this.state.tab === 'G20' ? g20 : hood;\n    const compareGroups = src.map(g => ({ name: g.name, tiles: g.tiles.filter(n => !q || n.includes(q)).map(mkTile) })).filter(g => g.tiles.length);\n    const pairsList = [\n      { a: 'PORTUGAL', b: 'BRAZIL', n: 31 }, { a: 'SPAIN', b: 'MEXICO', n: 27 }, { a: 'JAPAN', b: 'KOREA', n: 24 },\n      { a: 'FRANCE', b: 'ALGERIA', n: 22 }, { a: 'UNITED KINGDOM', b: 'INDIA', n: 21 }, { a: 'JAPAN', b: 'PORTUGAL', n: 14 }\n    ].filter(p => !q || p.a.includes(q) || p.b.includes(q)).map(p => Object.assign({}, p, {\n      load: () => this.setState({ slotA: p.a, slotB: p.b, nextSlot: 'A' })\n    }));\n\n    // ---- pair\n    const J = '#E2D3B8';\n    const pairEvents = [\n      { y: '1543', j: true, l: 'First European ship reaches the archipelago — Portuguese traders aboard', lr: '2 REFS', r: 'A crown-licensed voyage reaches the far eastern seas', rr: '2 REFS' },\n      { y: '1580', l: '', lr: '', r: 'Crown union with the neighbouring kingdom', rr: '3 REFS' },\n      { y: '1603', l: 'Shogunate established at Edo', lr: '3 REFS', r: '', rr: '' },\n      { y: '1639', j: true, l: 'Ports closed to Portuguese trade', lr: '2 REFS', r: 'The eastern trade legation is expelled', rr: '2 REFS' },\n      { y: '1755', l: '', lr: '', r: 'Great earthquake levels the capital', rr: '4 REFS' },\n      { y: '1868', l: 'Imperial rule restored', lr: '4 REFS', r: '', rr: '' },\n      { y: '1947', l: 'Constitution takes effect', lr: '5 REFS', r: '', rr: '' },\n      { y: '1974', l: '', lr: '', r: 'Carnation revolution ends the dictatorship', rr: '3 REFS' }\n    ].map(e => ({\n      y: e.y, l: e.l || '·', r: e.r || '·', lr: e.lr, rr: e.rr,\n      lc: e.l ? '#221E19' : '#B8AC97', rc: e.r ? '#221E19' : '#B8AC97',\n      bg: e.j ? J : 'transparent', yc: e.j ? '#A64B26' : '#221E19', dot: e.j ? '#A64B26' : '#EFE7D8'\n    }));\n    const duelDefs = [\n      { label: 'ECONOMY · GDP', a: { v: '¤1.23T', y: '’24', src: 'S-01', org: 'SAMPLE NATL ACCOUNTS OFFICE', method: 'production approach, annual' }, b: { v: '¤0.28T', y: '’24', src: 'S-21', org: 'SAMPLE STATISTICS INSTITUTE', method: 'production approach, annual' } },\n      { label: 'SOCIETY · POPULATION', a: { v: '123.4M', y: '’23', src: 'S-02', org: 'SAMPLE CENSUS BUREAU', method: 'national register, mid-year' }, b: { v: '10.4M', y: '’23', src: 'S-22', org: 'SAMPLE STATISTICS INSTITUTE', method: 'census projection' } },\n      { label: 'HEALTH · LIFE EXPECT.', a: { v: '84.5yr', y: '’23', src: 'S-04', org: 'SAMPLE VITAL STATISTICS DIV.', method: 'period life table' }, b: { v: '81.6yr', y: '’23', src: 'S-23', org: 'SAMPLE HEALTH DIRECTORATE', method: 'period life table' } },\n      { label: 'TECHNOLOGY · NET USE', a: { v: '89.0%', y: '’23', src: 'S-06', org: 'SAMPLE TELECOM UNION', method: 'household ICT survey' }, b: { v: '87.1%', y: '’23', src: 'S-26', org: 'SAMPLE TELECOM UNION', method: 'household ICT survey' } },\n      { label: 'MILITARY · EXPENDITURE', a: null, b: { v: '1.9% GDP', y: '’23', src: 'S-24', org: 'SAMPLE DEFENCE LEDGER', method: 'budget outturn' } }\n    ];\n    const duelRows = duelDefs.map((d, i) => {\n      const af = this.mkFlip('pa' + i), bf = this.mkFlip('pb' + i);\n      return {\n        label: d.label,\n        aObserved: !!d.a, aAbsent: !d.a, bObserved: !!d.b, bAbsent: !d.b,\n        aV: d.a && d.a.v, aY: d.a && d.a.y, aSrc: d.a && d.a.src, aOrg: d.a && d.a.org, aMethod: d.a && d.a.method,\n        aTf: af.tf, aDown: af.down, aUp: af.up,\n        bV: d.b && d.b.v, bY: d.b && d.b.y, bSrc: d.b && d.b.src, bOrg: d.b && d.b.org, bMethod: d.b && d.b.method,\n        bTf: bf.tf, bDown: bf.down, bUp: bf.up\n      };\n    });\n\n    return {\n      isFront: s === 'front', isCut: s === 'cut', isNation: s === 'nation', isRank: s === 'rank', isCompare: s === 'compare', isPair: s === 'pair',\n      goFront: () => this.go('front'), goCut: () => this.go('cut'), goNation: () => this.go('nation'),\n      goRank: () => this.go('rank'), goCompare: () => this.go('compare'), goPair: () => this.go('pair'),\n      navItems: items,\n      ov0: ov(0), ov1: ov(60), ov2: ov(120), ov3: ov(210), ov4: ov(300), ov5: ov(390), ov6: ov(480), ov7: ov(570),\n      cutBeds,\n      coreBands, eraBeds, dossierRows: dossier,\n      toggleProof: () => this.setState(st => ({ allProof: !st.allProof, flipped: {} })),\n      proofLabel: this.state.allProof ? 'CLOSE ⟲' : 'PROOF VIEW ⟲',\n      rankCols, absentRows, strip,\n      ledgeTf: (sel && this.state.ledgeUp) ? 'rotateX(180deg)' : 'rotateX(0deg)',\n      selRank: sel ? sel.rank : '', selName: sel ? sel.name : '', selValue: sel ? sel.value : '',\n      selObs: sel ? sel.obs : '', selSrc: sel ? sel.src : '', selOrg: sel ? sel.org : '', selMethod: sel ? sel.method : '',\n      tabs, compareGroups, pairsList,\n      showGroups: this.state.tab !== 'ENT', showEntangled: this.state.tab === 'ENT',\n      digInput: (e) => this.setState({ digQ: e.target.value }),\n      digNote: q ? ('DIGGING FOR “' + q + '” — THE BENCH FILTERS AS YOU TYPE') : 'DIG-TO-FILTER: TYPE ABOVE AND THE BENCH NARROWS · NEXT TAP FILLS SLOT ' + this.state.nextSlot,\n      slotA: this.state.slotA, slotB: this.state.slotB,\n      slotACoord: coord(this.state.slotA), slotBCoord: coord(this.state.slotB),\n      slotABg: this.state.nextSlot === 'A' ? '#E2D3B8' : '#EFE7D8',\n      slotBBg: this.state.nextSlot === 'B' ? '#E2D3B8' : '#EFE7D8',\n      pairEvents, duelRows\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
